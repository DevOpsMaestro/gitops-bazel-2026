apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gotk-components.yaml
  - gotk-sync.yaml
patches:
  - target:
      kind: Namespace
      name: flux-system
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: flux-system
        labels:
          istio-injection: disabled
  - target:
      kind: GitRepository
      name: flux-system
    patch: |-
      apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      metadata:
        name: flux-system
        namespace: flux-system
      spec:
        ref:
          branch: main
  # fluxcd images run as uid/gid 65534 by default (distroless nonroot);
  # runAsNonRoot is already set by flux bootstrap's generated manifest, this
  # just makes the group explicit for Kubescape's non-root-containers check.
  - target:
      kind: Deployment
      name: source-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: source-controller
        namespace: flux-system
      spec:
        template:
          spec:
            containers:
              - name: manager
                securityContext:
                  runAsGroup: 65534
  - target:
      kind: Deployment
      name: kustomize-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: kustomize-controller
        namespace: flux-system
      spec:
        template:
          spec:
            containers:
              - name: manager
                securityContext:
                  runAsGroup: 65534
  - target:
      kind: Deployment
      name: helm-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: helm-controller
        namespace: flux-system
      spec:
        template:
          spec:
            containers:
              - name: manager
                securityContext:
                  runAsGroup: 65534
  - target:
      kind: Deployment
      name: notification-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: notification-controller
        namespace: flux-system
      spec:
        template:
          spec:
            containers:
              - name: manager
                securityContext:
                  runAsGroup: 65534
